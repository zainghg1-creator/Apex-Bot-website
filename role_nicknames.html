<h2>🏷️ Rollen-Nicknames</h2>
<p>Wähle eine Rolle aus und lege ein Präfix und/oder Suffix fest. Hat ein Mitglied diese Rolle, wird der Nickname automatisch angepasst – entfernst du die Rolle, wird es automatisch zurückgesetzt.</p>

<div class="panel-card">
    <div class="form-group">
        <div class="switch-row">
            <label>Rollen-Nicknames aktiv</label>
            <label class="switch"><input type="checkbox" id="rolenicknames-enabled"><span class="switch-slider"></span></label>
        </div>
    </div>

    <div class="form-group">
        <label>Regeln</label>
        <div id="rolenick-list"></div>
        <button type="button" class="add-option-btn" onclick="addRoleNicknameRow()">+ Regel hinzufügen</button>
    </div>

    <div class="form-action">
        <span id="rolenicknames-save-status" class="hidden status-success"></span>
        <button class="btn btn-primary" onclick="handleSaveClick('rolenicknames')">Speichern</button>
    </div>
</div>
