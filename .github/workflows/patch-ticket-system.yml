name: One-time ticket system patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[ticket-fix]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch ticket system
        shell: python
        run: |
          from pathlib import Path

          # main.py: use a short cache fallback and always force the close button label.
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          old = '_CONFIG_CACHE_TTL = 600'
          new = '_CONFIG_CACHE_TTL = 5'
          if old in s:
              s = s.replace(old, new, 1)

          old = 'label=(close_cfg or {}).get("label") or "Ticket schließen",'
          new = 'label="Ticket schließen",'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # server.js: normalize saved ticket close-button labels so dashboard data
          # cannot accidentally turn the actual close button back into "Ticket öffnen".
          p = Path('server.js')
          s = p.read_text(encoding='utf-8')
          marker = "    let moduleData = req.body;\n"
          patch = '''    let moduleData = req.body;\n    if (module === 'tickets' && moduleData && Array.isArray(moduleData.options)) {\n      moduleData = {\n        ...moduleData,\n        options: moduleData.options.map(panel => ({\n          ...panel,\n          buttons: Array.isArray(panel.buttons)\n            ? panel.buttons.map(button => button?.action === 'close'\n              ? { ...button, label: 'Ticket schließen' }\n              : button)\n            : panel.buttons\n        }))\n      };\n    }\n'''
          if marker in s and patch not in s:
              s = s.replace(marker, patch, 1)
          p.write_text(s, encoding='utf-8')

          # dashboard.js: prevent browser caching of API responses.
          p = Path('dashboard.js')
          s = p.read_text(encoding='utf-8')
          marker = "  const res = await fetch(`${CONFIG.API_BASE}${endpoint}`, {\n"
          replacement = "  const res = await fetch(`${CONFIG.API_BASE}${endpoint}`, {\n    cache: 'no-store',\n"
          if marker in s and replacement not in s:
              s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')

          # dashboard.html: make any remaining visible ticket-open button label say close.
          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('>Ticket öffnen<', '>Ticket schließen<')
          s = s.replace('>Ticket Öffnen<', '>Ticket schließen<')
          p.write_text(s, encoding='utf-8')

          # Remove this one-time patch workflow after it has done its job.
          Path('.github/workflows/patch-ticket-system.yml').unlink(missing_ok=True)

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py server.js dashboard.js dashboard.html .github/workflows/patch-ticket-system.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "fix ticket updates and close button [ticket-fix]"
          git push
