<h2>🤖 Bot Control</h2>
<p>Sende Nachrichten als Bot, bearbeite bestehende Nachrichten und verwalte deine Bot-Nachrichten.</p>

<div class="panel-card">
    <div class="form-group">
        <label for="bot-channel">Kanal auswählen</label>
        <select id="bot-channel"></select>
    </div>
    <button class="btn btn-secondary" onclick="loadBotMessages()" style="margin-top:6px;">📥 Nachrichten laden</button>
</div>

<div class="panel-card">
    <h3 style="font-size:1rem; font-weight:700; margin-bottom:6px;">✏️ Nachricht verfassen</h3>
    <div class="form-group">
        <label>Text (optional)</label>
        <textarea id="bot-content" rows="2" placeholder="Nachrichtentext..."></textarea>
    </div>
    <div class="form-group">
        <label>Embed(s) – Titel, Beschreibung, Farbe, Bild-URL</label>
        <div id="bot-embeds-list"></div>
        <button type="button" class="add-option-btn" onclick="addBotEmbed()">+ Embed hinzufügen</button>
    </div>
    <div class="form-group">
        <label>Buttons – Label, Stil und Aktion</label>
        <div id="bot-buttons-list"></div>
        <button type="button" class="add-option-btn" onclick="addBotButton()">+ Button hinzufügen</button>
    </div>
    <div class="form-action">
        <button class="btn btn-primary" onclick="sendBotMessage()">📤 Senden</button>
        <button class="btn btn-secondary" onclick="editBotMessage()">✏️ Bearbeiten (Nachricht-ID unten)</button>
    </div>
</div>

<div class="panel-card">
    <h3 style="font-size:1rem; font-weight:700; margin-bottom:6px;">📋 Bot-Nachrichten in diesem Kanal</h3>
    <div id="bot-messages-list"><span class="chip-empty">Wähle einen Kanal und lade die Nachrichten.</span></div>
</div>
