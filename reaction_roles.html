<h2>🎭 Reaction Roles</h2>
<p>Erstelle eine Nachricht, auf die Mitglieder mit einem Emoji reagieren können, um automatisch eine Rolle zu bekommen. Entfernen sie die Reaktion wieder, wird die Rolle auch wieder entfernt.</p>

<div id="reactionroles-list"></div>
<button type="button" class="add-option-btn" onclick="addReactionRolePanel()">+ Neue Reaction-Role Nachricht</button>

<div class="form-action" style="margin-top:14px;">
    <span id="reactionroles-save-status" class="hidden status-success"></span>
    <button class="btn btn-primary" onclick="handleSaveClick('reactionroles')">💾 Speichern</button>
</div>
